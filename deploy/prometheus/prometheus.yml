# Scrape configuration for the Nexus stack (Phase E). Exporter jobs
# (postgres_exporter, redis_exporter) are expected from the compose overlay;
# only the API scrape target is defined by the app itself.
global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    cluster: nexus

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: nexus-api
    metrics_path: /metrics
    static_configs:
      # METRICS_ADDR on the API container; reachable on the compose network.
      - targets: ["api:9090"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
