name: Release

# Image builds run exclusively on CI runners: the local sandbox cannot build
# container images (outbound apk/CDN access is blocked there), so the CI
# runner builds, size-gates, and publishes to GHCR.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/oddsmyanamr-cyber/nexus-api

jobs:
  images:
    # Docker-in-Docker: the job talks to a privileged dind daemon over TCP
    # instead of the host socket, so builds behave identically everywhere.
    # The daemon runs without TLS — the socket lives only on the ephemeral
    # runner's job network, and the /certs client-cert bind mount does not
    # exist for jobs that do not run inside a container.
    runs-on: ubuntu-latest
    services:
      docker:
        image: docker:27-dind
        options: --privileged
        env:
          DOCKER_TLS_CERTDIR: ""
    env:
      DOCKER_HOST: tcp://docker:2375
      DOCKER_TLS_VERIFY: ""
      DOCKER_CERT_PATH: ""
    outputs:
      tag: ${{ steps.build.outputs.tag }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Wait for the dind daemon
        run: |
          # The service container needs a moment to start dockerd; every
          # docker command before that fails instantly on connection refused.
          for i in $(seq 1 30); do
            if docker info >/dev/null 2>&1; then
              echo "dind ready"
              exit 0
            fi
            sleep 2
          done
          echo "dind never became ready"
          exit 1

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build API image
        id: build
        run: |
          TAG="${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::12}"
          docker build -f Dockerfile.api -t "$IMAGE:$TAG" .
          docker images --format 'table {{.Repository}}\t{{.Tag}}\t{{.Size}}'
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Size gate (<100MB uncompressed)
        run: |
          BYTES=$(docker image inspect "$IMAGE:${{ steps.build.outputs.tag }}" --format '{{.Size}}')
          HUMAN=$(numfmt --to=iec-i --suffix=B "$BYTES")
          echo "uncompressed size: $HUMAN ($BYTES bytes)"
          if [ "$BYTES" -ge 104857600 ]; then
            echo "FAIL: image is $HUMAN, at or above the 100MB gate"
            exit 1
          fi

      - name: Push to GHCR and record digest
        id: push
        run: |
          docker push "$IMAGE:${{ steps.build.outputs.tag }}"
          DIGEST=$(docker image inspect "$IMAGE:${{ steps.build.outputs.tag }}" \
            --format '{{index .RepoDigests 0}}' | cut -d@ -f2)
          {
            echo "### nexus-api image"
            echo "- tag: \`$IMAGE:${{ steps.build.outputs.tag }}\`"
            echo "- digest: \`$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
