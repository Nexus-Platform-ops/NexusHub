name: Release

# Image builds run exclusively on CI runners: the local sandbox cannot build
# container images (outbound apk/CDN access is blocked there), so the CI
# runner builds, size-gates, and publishes to GHCR.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/oddsmyanamr-cyber/nexus-api

jobs:
  images:
    # Docker-in-Docker: the job talks to a privileged dind daemon over TCP
    # instead of the host socket, so builds behave identically everywhere.
    # The daemon runs without TLS — the socket lives only on the ephemeral
    # runner's job network, and the /certs client-cert bind mount does not
    # exist for jobs that do not run inside a container. VM jobs reach
    # service containers through localhost port mappings (same as the CI
    # workflow's postgres service), not through the service hostname.
    runs-on: ubuntu-latest
    services:
      docker:
        image: docker:27-dind
        options: --privileged
        ports:
          - "2375:2375"
        env:
          DOCKER_TLS_CERTDIR: ""
    env:
      DOCKER_HOST: tcp://127.0.0.1:2375
      DOCKER_TLS_VERIFY: ""
      DOCKER_CERT_PATH: ""
    outputs:
      tag: ${{ steps.build.outputs.tag }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Wait for the dind daemon
        run: |
          # The service container needs a moment to start dockerd; every
          # docker command before that fails instantly on connection refused.
          for i in $(seq 1 30); do
            if docker info >/dev/null 2>&1; then
              echo "dind ready"
              exit 0
            fi
            sleep 2
          done
          echo "dind never became ready"
          exit 1

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build API image
        id: build
        run: |
          TAG="${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::12}"
          docker build -f Dockerfile.api -t "$IMAGE:$TAG" .
          docker images --format 'table {{.Repository}}\t{{.Tag}}\t{{.Size}}'
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Size gate (<100MB uncompressed)
        run: |
          BYTES=$(docker image inspect "$IMAGE:${{ steps.build.outputs.tag }}" --format '{{.Size}}')
          HUMAN=$(numfmt --to=iec-i --suffix=B "$BYTES")
          echo "uncompressed size: $HUMAN ($BYTES bytes)"
          if [ "$BYTES" -ge 104857600 ]; then
            echo "FAIL: image is $HUMAN, at or above the 100MB gate"
            exit 1
          fi

      - name: Push to GHCR and record digest
        id: push
        run: |
          docker push "$IMAGE:${{ steps.build.outputs.tag }}"
          DIGEST=$(docker image inspect "$IMAGE:${{ steps.build.outputs.tag }}" \
            --format '{{index .RepoDigests 0}}' | cut -d@ -f2)
          {
            echo "### nexus-api image"
            echo "- tag: \`$IMAGE:${{ steps.build.outputs.tag }}\`"
            echo "- digest: \`$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

  android:
    # Release APK + AAB. Signing material is injected only when the repo
    # secrets exist; otherwise the build falls back to the debug key so the
    # pipeline still proves the R8/ProGuard release build works.
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: Inject release signing material
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: mobile/android
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > app/nexus-release.keystore
          {
            echo "storeFile=nexus-release.keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > key.properties

      - run: flutter pub get
        working-directory: mobile

      - run: flutter analyze
        working-directory: mobile

      - name: Build release appbundle
        working-directory: mobile
        run: |
          flutter build appbundle --release --dart-define=API_BASE=https://api.nexus.app

      - name: Build release APK
        working-directory: mobile
        run: |
          flutter build apk --release --dart-define=API_BASE=https://api.nexus.app

      - name: Record artifact SHA256
        id: sha
        working-directory: mobile
        run: |
          {
            echo "### Android artifacts"
            sha256sum \
              build/app/outputs/flutter-apk/app-release.apk \
              build/app/outputs/bundle/release/app-release.aab
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            mobile/build/app/outputs/flutter-apk/app-release.apk
            mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  ios:
    # iOS archive. Without signing secrets this builds an unsigned archive
    # (--no-codesign), which still proves compilation + CocoaPods linkage.
    # With IOS_P12_BASE64/IOS_PROVISION_PROFILE_BASE64 set, it produces a
    # signed IPA via flutter build ipa.
    runs-on: macos-14
    env:
      HAS_IOS_CERTS: ${{ secrets.IOS_P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - run: flutter pub get
        working-directory: mobile

      - run: flutter analyze
        working-directory: mobile

      - name: Pod install
        working-directory: mobile/ios
        run: pod install --repo-update

      - name: Build unsigned iOS archive
        if: env.HAS_IOS_CERTS != 'true'
        working-directory: mobile
        run: |
          flutter build ios --release --no-codesign --dart-define=API_BASE=https://api.nexus.app

      - name: Build signed iOS archive
        if: env.HAS_IOS_CERTS == 'true'
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          EXPORT_OPTIONS_BASE64: ${{ secrets.IOS_EXPORT_OPTIONS_BASE64 }}
        working-directory: mobile
        run: |
          KEYCHAIN=nexus-build.keychain
          security create-keychain -p "" "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          printf '%s' "$P12_BASE64" | base64 -d > /tmp/nexus.p12
          security import /tmp/nexus.p12 -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          printf '%s' "$PROFILE_BASE64" | base64 -d > "$HOME/Library/MobileDevice/Provisioning Profiles/nexus.mobileprovision"
          printf '%s' "$EXPORT_OPTIONS_BASE64" | base64 -d > ios/ExportOptions.plist
          flutter build ipa --release --dart-define=API_BASE=https://api.nexus.app --export-options-plist=ios/ExportOptions.plist

      - name: Record artifact SHA256
        working-directory: mobile
        run: |
          {
            echo "### iOS artifacts"
            find build -name '*.app' -o -name '*.ipa' | while read -r f; do
              shasum -a 256 "$f"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: |
            mobile/build/ios/ipa/
            mobile/build/ios/iphoneos/

      - uses: actions/upload-artifact@v4
        with:
          name: ios-podfile-lock
          path: mobile/ios/Podfile.lock
          if-no-files-found: error
