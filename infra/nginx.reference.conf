# Nexus API — nginx reference configuration.
#
# The official stack terminates TLS with Caddy (deploy/Caddyfile); this file
# documents the equivalent hardening for nginx-based deployments:
# TLS 1.3 only, HSTS with preload, and per-IP rate limiting with a stricter
# bucket for auth endpoints. Assumes the API upstream on 127.0.0.1:8080.

# Per-IP zones: general API traffic, plus a tight bucket for credential
# endpoints. 10m of shared memory covers ~160k tracked addresses per zone.
limit_req_zone $binary_remote_addr zone=nexus_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=nexus_auth:10m rate=2r/s;

upstream nexus_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.example.com;

    # TLS 1.3 only; session tickets disabled for forward secrecy.
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_session_tickets off;
    ssl_session_cache shared:nexus_tls:10m;

    # HSTS: 2 years, subdomains, preload-eligible.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    client_max_body_size 5m;

    # Infra probes: cheap, never rate-limited. /healthz is liveness, /readyz
    # pings Postgres + Redis — use /readyz for load-balancer health checks.
    location = /healthz { proxy_pass http://nexus_api; }
    location = /readyz  { proxy_pass http://nexus_api; }

    # Credential endpoints get the tight bucket; tolerate small bursts.
    location ~ ^/api/v1/auth/ {
        limit_req zone=nexus_auth burst=5 nodelay;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://nexus_api;
    }

    location / {
        limit_req zone=nexus_api burst=40 nodelay;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://nexus_api;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;
    return 301 https://$host$request_uri;
}
